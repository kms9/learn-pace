packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
patchedDependencies:
  '@earendil-works/pi-ai@1.6.0': patches/@earendil-works__pi-ai@1.6.0.patch
  react-native-enriched-markdown@1.1.1: patches/react-native-enriched-markdown@1.1.1.patch

# Keep patched paths compatible with Android Prefab.
virtualStoreDirMaxLength: 40

# Expo Router auto-resolves a React DOM peer. Keep it aligned with Expo's React version.
overrides:
  react-dom: 19.3.0
